[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbys"
version = "0.1.0"
description = "Python client and CLI for the CheckBeforeYouShop public API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cbys = "cbys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cbys = ["py.typed"]
