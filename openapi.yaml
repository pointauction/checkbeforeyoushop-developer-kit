                        is_stale: false
                        last_confirmed_at: '2026-11-22T18:20:19.060731+00:00'
                        listing_label: null
                        go_url: https://checkbeforeyoushop.com/go/upromise?plc=api&m=aae23c9a-684c-4b38-9b40-8a630f75fa7e
                      - portal_id: swagbucks
                        portal_name: Swagbucks
