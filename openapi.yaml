openapi: 3.1.0
info:
  title: CheckBeforeYouShop Public API
  version: 1.0.0
  description: Read-only public endpoints. Rate values remain in their native units.
servers:
- url: https://checkbeforeyoushop.com
paths:
  /api/v1/search.json:
    get:
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 256
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    type: object
                    required:
                    - query
                    - count
                    - results
                    properties:
                      query:
                        type: string
                      count:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          required:
                          - kind
                          - slug
                          - name
                          - domain
                          - page_url
                          properties:
                            kind:
                              type: string
                              enum:
                              - merchant
                              - portal
                            slug:
                              type: string
                            name:
                              type: string
                            domain:
                              type:
                              - string
                              - 'null'
                            page_url:
                              type: string
                              format: uri
        '400': &id001
          description: JSON API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default: *id001
  /api/v1/merchants/{slug}.json:
    get:
      operationId: merchant
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Merchant rates and verdict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    type: object
                    required:
                    - merchant
                    - summary
                    - verdict
                    - best_rates
                    - rates
                    properties:
                      merchant:
                        $ref: '#/components/schemas/Merchant'
                      summary:
                        type: string
                      verdict:
                        oneOf:
                        - $ref: '#/components/schemas/Verdict'
                        - type: 'null'
                      best_rates:
                        type: array
                        items:
                          $ref: '#/components/schemas/MerchantRate'
                      rates:
                        type: array
                        items:
                          $ref: '#/components/schemas/MerchantRate'
        '400': *id001
        '404': *id001
        default: *id001
  /api/v1/portals.json:
    get:
      operationId: portals
      responses:
        '200':
          description: Portal directory
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    type: object
                    required:
                    - count
                    - active_count
                    - portals
                    properties:
                      count:
                        type: integer
                      active_count:
                        type: integer
                      portals:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalDirectory'
        default: *id001
  /api/v1/portals/{portal}.json:
    get:
      operationId: portal
      parameters:
      - name: portal
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Portal profile and top current rates
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    type: object
                    required:
                    - portal
                    - top_rates
                    properties:
                      portal:
                        $ref: '#/components/schemas/PortalDetail'
                      top_rates:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalRate'
        '400': *id001
        '404': *id001
        default: *id001
  /api/v1/highs.json:
    get:
      operationId: highs
      responses:
        '200':
          description: Rates currently at or near observed highs
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    type: object
                    required:
                    - count
                    - highs
                    properties:
                      count:
                        type: integer
                      highs:
                        type: array
                        items:
                          $ref: '#/components/schemas/High'
        default: *id001
components:
  schemas:
    Envelope:
      type: object
      required:
      - data
      - data_as_of
      - source
      - attribution
      - disclosure
      properties:
        data:
          type: object
        data_as_of:
          type:
          - string
          - 'null'
          format: date-time
        source:
          type: string
        attribution:
          type: string
        disclosure:
          type: string
    PortalDirectory:
      type: object
      required:
      - portal_id
      - name
      - program
      - payout_kind
      - category
      - category_label
      - merchants_tracked
      - cadence_hours
      - last_success_at
      - is_active
      - page_url
      properties:
        portal_id:
          type: string
        name:
          type: string
        program:
          type: string
        payout_kind:
          type:
          - string
          - 'null'
        category:
          type: string
        category_label:
          type: string
        merchants_tracked:
          type: integer
        cadence_hours:
          type: integer
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
        is_active:
          type: boolean
        page_url:
          type: string
          format: uri
    PortalDetail:
      type: object
      required:
      - portal_id
      - name
      - program
      - category
      - category_label
      - merchants_tracked
      - cadence_hours
      - last_success_at
      - page_url
      properties:
        portal_id:
          type: string
        name:
          type: string
        program:
          type: string
        payout_kind:
          type:
          - string
          - 'null'
        category:
          type: string
        category_label:
          type: string
        merchants_tracked:
          type: integer
        cadence_hours:
          type: integer
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
        page_url:
          type: string
          format: uri
    Merchant:
      type: object
      required:
      - slug
      - name
      - domain
      - page_url
      - portals_tracked
      - tracked_since
      properties:
        slug:
          type: string
        name:
          type: string
        domain:
          type:
          - string
          - 'null'
        page_url:
          type: string
          format: uri
        portals_tracked:
          type: integer
        tracked_since:
          type:
          - string
          - 'null'
          format: date-time
    Verdict:
      type: object
      required:
      - headline
      - tone
      - caveats
      properties:
        headline:
          type: string
        tone:
          type: string
        caveats:
          type: array
          items:
            type: string
    MerchantRate:
      type: object
      required:
      - portal_id
      - portal_name
      - program
      - payout_kind
      - rate_value
      - rate_unit
      - rate_kind
      - rate_display
      - unit_group
      - is_up_to
      - best_category_value
      - best_category_label
      - is_elevated
      - is_stale
      - last_confirmed_at
      - go_url
      properties:
        portal_id:
          type: string
        portal_name:
          type: string
        program:
          type: string
        payout_kind:
          type:
          - string
          - 'null'
        rate_value:
          type: number
        rate_unit:
          type: string
        rate_kind:
          type: string
        rate_display:
          type: string
        unit_group:
          type: string
        is_up_to:
          type: boolean
        best_category_value:
          type:
          - number
          - 'null'
        best_category_label:
          type:
          - string
          - 'null'
        is_elevated:
          type: boolean
        is_stale:
          type: boolean
        last_confirmed_at:
          type: string
          format: date-time
        listing_label:
          type:
          - string
          - 'null'
        go_url:
          type:
          - string
          - 'null'
          format: uri
    PortalRate:
      type: object
      required:
      - merchant_slug
      - merchant_name
      - rate_value
      - rate_unit
      - rate_kind
      - rate_display
      - unit_group
      - is_up_to
      - is_elevated
      - is_stale
      - page_url
      properties:
        merchant_slug:
          type: string
        merchant_name:
          type: string
        rate_value:
          type: number
        rate_unit:
          type: string
        rate_kind:
          type: string
        rate_display:
          type: string
        unit_group:
          type: string
        is_up_to:
          type: boolean
        is_elevated:
          type: boolean
        is_stale:
          type: boolean
        page_url:
          type: string
          format: uri
    High:
      type: object
      required:
      - merchant_slug
      - merchant_name
      - portal_id
      - portal_name
      - program
      - payout_kind
      - rate_value
      - rate_unit
      - rate_kind
      - rate_display
      - unit_group
      - is_all_time_high
      - typical_range
      - page_url
      properties:
        merchant_slug:
          type: string
        merchant_name:
          type: string
        portal_id:
          type: string
        portal_name:
          type: string
        program:
          type: string
        payout_kind:
          type:
          - string
          - 'null'
        rate_value:
          type: number
        rate_unit:
          type: string
        rate_kind:
          type: string
        rate_display:
          type: string
        unit_group:
          type: string
        is_all_time_high:
          type: boolean
        typical_range:
          type:
          - string
          - 'null'
        page_url:
          type: string
          format: uri
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
