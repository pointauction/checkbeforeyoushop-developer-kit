  /api/v1/highs.json:
    get:
      operationId: highs
      summary: Rates at or near tracked highs
      responses:
        '200':
          description: Highs with the newest confirmation among included rows, or null when the feed is empty.
          headers: *successHeaders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/HighsData'
              examples:
                capture:
