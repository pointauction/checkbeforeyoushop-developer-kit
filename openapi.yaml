openapi: 3.1.0
info:
  title: CheckBeforeYouShop Public API
  version: 1.0.0
  description: |
    Read-only public API. Clients should tolerate new response fields.

    Preserve each rate's native unit, kind, display value, and rewards program.
    Only compare values within the same rate_unit and rate_kind. Keep one-time
    bonuses separate from earn rates. If a portal row is missing, report that
    no tracked listing was returned.

    Credit CheckBeforeYouShop and link to each item's page_url when using
    the data. Preserve source, attribution, and disclosure when re-serving rates.

    GET and CORS OPTIONS are explicit handlers on every path. Astro also
    serves HEAD through GET and strips the body. For unsupported methods the
    framework falls back to a 404 outside the JSON error contract. Unhandled
    server errors are likewise handled by the framework or hosting platform.
servers:
  - url: https://checkbeforeyoushop.com
paths:
  /api/v1/search.json:
    get:
      operationId: search
      summary: Search for a merchant or portal
      description: |
        Use an exact slug, name, or domain to confirm a result. If several
        candidates fit, show them and ask which store, market, or portal the
        caller means. Confirm spelling suggestions before using them.
      parameters:
        - name: q
          in: query
          required: true
          description: |
            Supply at least 2 UTF-16 code units after trimming. The server
            caps processed text at 256 UTF-16 code units and can canonicalize
            an address to an HTTPS URL with only its host. A rejected address returns an empty 200.
          schema:
            type: string
          example: nike
      responses:
        '200':
          description: Up to 25 search results. The envelope timestamp is null.
          headers: &successHeaders
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/CorsOrigin'
            Access-Control-Allow-Methods:
              $ref: '#/components/headers/CorsMethods'
            Access-Control-Allow-Headers:
              $ref: '#/components/headers/CorsHeaders'
            Cache-Control:
              $ref: '#/components/headers/PublicCache'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data_as_of:
                        type: 'null'
                      data:
                        $ref: '#/components/schemas/SearchData'
              examples:
                capture:
                  summary: Trimmed response captured on November 22, 2026
                  value:
                    data:
                      query: delta
                      count: 2
                      results:
                      - kind: portal
                        slug: delta-skymiles
                        name: Delta SkyMiles Shopping
                        domain: null
                        did_you_mean: false
                        page_url: https://checkbeforeyoushop.com/p/delta-skymiles
                      - kind: merchant
                        slug: delta-faucet
                        name: Delta Faucet
                        domain: deltafaucet.com
                        did_you_mean: false
                        page_url: https://checkbeforeyoushop.com/m/delta-faucet
                      did_you_mean: false
                    data_as_of: null
                    source: CheckBeforeYouShop
                    attribution: Data from CheckBeforeYouShop (checkbeforeyoushop.com), free to use with attribution
                      and a link to each item's page_url.
                    disclosure: Rates are read from each portal's pages and can change or go stale, so always confirm
                      on the portal before shopping. Some portal links may earn us a referral bonus; that never changes
                      the rates or their order.
        '400':
          $ref: '#/components/responses/ShortQuery'
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      operationId: searchOptions
      responses:
        '204':
          $ref: '#/components/responses/Preflight'
  /api/v1/merchants/{slug}.json:
    parameters:
      - name: slug
        in: path
        required: true
        description: Merchant slug from search.
        schema:
          type: string
          minLength: 1
        example: nike
    get:
      operationId: merchant
      summary: Merchant rates and historical verdict
      responses:
        '200':
          description: Merchant details with the newest confirmation across its rate rows.
          headers: *successHeaders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data_as_of:
                        type: string
                      data:
                        $ref: '#/components/schemas/MerchantData'
              examples:
                capture:
                  summary: response captured on November 22, 2026
                  value:
                    data:
                      merchant:
                        slug: delta-air-lines
                        name: Delta Air Lines
                        domain: null
                        page_url: https://checkbeforeyoushop.com/m/delta-air-lines
                        portals_tracked: 3
                        tracked_since: '2026-07-12T12:35:31.521106+00:00'
                      summary: As of Nov 22, 2026, the best cashback for Delta Air Lines is 10% (Swagbucks SB) via Swagbucks
                        and Upromise, across the 3 portals carrying Delta Air Lines.
                      verdict:
                        headline: 10% (Swagbucks SB) is the highest we've ever seen for Delta Air Lines (typical 3%).
                          Swagbucks and Upromise both pay it.
                        tone: ath
                        caveats: []
                      best_rates:
                      - portal_id: swagbucks
                        portal_name: Swagbucks
                        program: Swagbucks SB
                        payout_kind: null
                        rate_value: 10
