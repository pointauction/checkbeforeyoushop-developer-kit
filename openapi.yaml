                        is_elevated: true
                        is_stale: false
                        last_confirmed_at: '2026-11-22T19:07:45.446899+00:00'
                        listing_label: null
                        go_url: https://checkbeforeyoushop.com/go/swagbucks?plc=api&m=aae23c9a-684c-4b38-9b40-8a630f75fa7e
                    data_as_of: '2026-11-22T19:07:45.446899+00:00'
                    source: CheckBeforeYouShop
                    attribution: Data from CheckBeforeYouShop (checkbeforeyoushop.com), free to use with attribution
                      and a link to each item's page_url.
                    disclosure: Rates are read from each portal's pages and can change or go stale, so always confirm
                      on the portal before shopping. Some portal links may earn us a referral bonus; that never changes
                      the rates or their order.
        '400':
          $ref: '#/components/responses/MissingMerchantSlug'
        '404':
          $ref: '#/components/responses/MerchantNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      operationId: merchantOptions
      responses:
        '204':
          $ref: '#/components/responses/Preflight'
  /api/v1/portals.json:
    get:
      operationId: portals
      summary: Comparison portal directory
      responses:
        '200':
          description: Directory with the latest successful check across its portals, or null when unavailable.
          headers: *successHeaders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PortalDirectoryData'
              examples:
                capture:
                  summary: Trimmed response captured on November 22, 2026
                  value:
                    data:
                      count: 2
                      active_count: 2
                      portals:
                      - portal_id: accor-collections
                        name: Accor Collections by ALL
                        program: ALL Reward points
                        payout_kind: null
                        category: points
                        category_label: Other points
                        merchants_tracked: 182
                        cadence_hours: 24
                        last_success_at: '2026-11-22T09:38:40.195306+00:00'
                        is_active: true
                        page_url: https://checkbeforeyoushop.com/p/accor-collections
                      - portal_id: activejunky
                        name: Active Junky
                        program: cash
                        payout_kind: null
                        category: cashback
                        category_label: Cashback
                        merchants_tracked: 970
                        cadence_hours: 24
                        last_success_at: '2026-11-22T13:26:53.775617+00:00'
                        is_active: true
                        page_url: https://checkbeforeyoushop.com/p/activejunky
                    data_as_of: '2026-11-22T13:26:53.775617+00:00'
                    source: CheckBeforeYouShop
                    attribution: Data from CheckBeforeYouShop (checkbeforeyoushop.com), free to use with attribution
                      and a link to each item's page_url.
                    disclosure: Rates are read from each portal's pages and can change or go stale, so always confirm
                      on the portal before shopping. Some portal links may earn us a referral bonus; that never changes
                      the rates or their order.
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      operationId: portalsOptions
      responses:
        '204':
          $ref: '#/components/responses/Preflight'
  /api/v1/portals/{portal}.json:
    parameters:
      - name: portal
        in: path
        required: true
        description: Portal ID from the directory or portal slug from search.
        schema:
          type: string
          minLength: 1
        example: rakuten
    get:
      operationId: portal
      summary: Portal profile and a sample of its top rates
      responses:
        '200':
          description: Portal profile with its last successful check as the envelope timestamp.
          headers: *successHeaders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PortalData'
              examples:
                capture:
                  summary: Trimmed response captured on November 22, 2026
                  value:
                    data:
                      portal:
                        portal_id: delta-skymiles
                        name: Delta SkyMiles Shopping
                        program: Delta SkyMiles
                        category: airline
                        category_label: Airline miles
                        merchants_tracked: 1313
                        cadence_hours: 6
                        last_success_at: '2026-11-22T16:44:02.952308+00:00'
                        page_url: https://checkbeforeyoushop.com/p/delta-skymiles
                      top_rates:
                      - merchant_slug: network-solutions
                        merchant_name: Network Solutions
                        rate_value: 20
                        rate_unit: miles_per_dollar
                        rate_kind: earn_rate
                        rate_display: 20 mi/$
                        unit_group: Airline miles
                        is_up_to: false
                        is_elevated: false
                        is_stale: false
                        page_url: https://checkbeforeyoushop.com/m/network-solutions
                    data_as_of: '2026-11-22T16:44:02.952308+00:00'
                    source: CheckBeforeYouShop
                    attribution: Data from CheckBeforeYouShop (checkbeforeyoushop.com), free to use with attribution
                      and a link to each item's page_url.
                    disclosure: Rates are read from each portal's pages and can change or go stale, so always confirm
                      on the portal before shopping. Some portal links may earn us a referral bonus; that never changes
                      the rates or their order.
        '400':
          $ref: '#/components/responses/MissingPortalId'
        '404':
          $ref: '#/components/responses/PortalNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      operationId: portalOptions
      responses:
        '204':
