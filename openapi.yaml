                        typical_range: 5%
                        page_url: https://checkbeforeyoushop.com/m/buckle
                    data_as_of: '2026-11-22T23:00:59.017375+00:00'
                    source: CheckBeforeYouShop
                    attribution: Data from CheckBeforeYouShop (checkbeforeyoushop.com), free to use with attribution
                      and a link to each item's page_url.
                    disclosure: Rates are read from each portal's pages and can change or go stale, so always confirm
                      on the portal before shopping. Some portal links may earn us a referral bonus; that never changes
                      the rates or their order.
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      operationId: highsOptions
      responses:
        '204':
          $ref: '#/components/responses/Preflight'
components:
  headers:
    CorsOrigin:
      schema:
        type: string
        const: '*'
    CorsMethods:
      schema:
        type: string
        const: GET, OPTIONS
    CorsHeaders:
      schema:
        type: string
        const: '*'
    PublicCache:
      description: |
        At the origin, public, max-age=300, s-maxage=900, stale-while-revalidate=3600.
        The hosting platform may consume shared-cache directives. Middleware
        sets no-store when the response comes from a degraded read.
      schema:
        type: string
      example: 'public, max-age=300'
    NoStore:
      schema:
        type: string
        const: no-store
  responses:
    Preflight:
      description: CORS preflight with an empty body.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/CorsOrigin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/CorsMethods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/CorsHeaders'
    ShortQuery:
      description: The query is missing or has fewer than 2 UTF-16 code units after trimming.
      headers: &errorHeaders
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/CorsOrigin'
        Access-Control-Allow-Methods:
          $ref: '#/components/headers/CorsMethods'
        Access-Control-Allow-Headers:
          $ref: '#/components/headers/CorsHeaders'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema: &errorSchema
            $ref: '#/components/schemas/Error'
          example:
            error: q must be at least 2 characters
    MissingMerchantSlug:
      description: The route handler was invoked without a merchant slug.
      headers: *errorHeaders
      content:
        application/json:
          schema: *errorSchema
          example:
            error: missing merchant slug
    MerchantNotFound:
      description: No merchant with tracked comparison rates was found for this slug.
      headers: *errorHeaders
      content:
        application/json:
          schema: *errorSchema
          example:
            error: merchant not found
    MissingPortalId:
      description: The route handler was invoked without a portal ID.
      headers: *errorHeaders
      content:
        application/json:
          schema: *errorSchema
          example:
            error: missing portal id
    PortalNotFound:
      description: No portal profile was found for this ID.
      headers: *errorHeaders
      content:
        application/json:
          schema: *errorSchema
          example:
            error: portal not found
    ServerError:
      description: |
        The handler failed and the framework or hosting platform generated
        the response. The body, content type, CORS headers, and cache headers
        are platform-dependent.
  schemas:
    Envelope:
      type: object
      required: [data, data_as_of, source, attribution, disclosure]
      properties:
        data:
          type: object
        data_as_of:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Response-level freshness. The endpoint defines the timestamp's source.
        source:
          type: string
          const: CheckBeforeYouShop
        attribution:
          type: string
          description: Credit the source and link each item to its page_url when using the data.
        disclosure:
          type: string
          description: Carry this rate freshness and referral disclosure when re-serving rates.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
    PageUrl:
      type: string
      format: uri
      description: Absolute HTTPS URL on checkbeforeyoushop.com for attribution.
    SearchData:
      type: object
      required: [query, count, results, did_you_mean]
      properties:
        query:
          type: string
          maxLength: 256
          description: Processed query. An empty string indicates a rejected address.
        count:
          type: integer
          minimum: 0
          maximum: 25
          description: Number of returned results.
        results:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/SearchResult'
        did_you_mean:
          type: boolean
          description: True when at least one returned result is a spelling suggestion.
    SearchResult:
      type: object
      required: [kind, slug, name, domain, did_you_mean, page_url]
      if:
        properties:
          kind:
            const: portal
      then:
        properties:
          domain:
            type: 'null'
      properties:
        kind:
          type: string
          enum: [merchant, portal]
        slug:
          type: string
        name:
          type: string
        domain:
          type: [string, 'null']
          description: Merchant domain when available. Always null for a portal.
        did_you_mean:
          type: boolean
          description: True for a bounded spelling suggestion the caller should confirm.
        page_url:
          $ref: '#/components/schemas/PageUrl'
    MerchantData:
      type: object
      required: [merchant, summary, verdict, best_rates, rates]
      properties:
        merchant:
          $ref: '#/components/schemas/Merchant'
        summary:
          type: [string, 'null']
          description: Citation sentence, or null when there is no eligible lead.
        verdict:
          $ref: '#/components/schemas/Verdict'
        best_rates:
          type: array
          description: |
            At most one leader per exact rate_unit from rates. The selection
            uses effective category ceilings, favors a rate without an
            upper-bound qualifier at equal value, and excludes zero rates. Stale
            candidates can be excluded by a server setting. Look in rates
            for a specific program even if it has no leader here.
          items:
            $ref: '#/components/schemas/BestRate'
        rates:
          type: array
          minItems: 1
          description: All returned comparison listings, including stale and zero-rate rows.
          items:
            $ref: '#/components/schemas/MerchantRate'
    Merchant:
      type: object
      required: [slug, name, domain, page_url, portals_tracked, tracked_since]
      properties:
        slug:
          type: string
        name:
          type: string
        domain:
          type: [string, 'null']
        page_url:
          $ref: '#/components/schemas/PageUrl'
        portals_tracked:
          type: integer
          minimum: 1
          description: Number of distinct portals in rates.
        tracked_since:
          type: string
          format: date-time
          description: Earliest recorded rate event, falling back to the earliest current row's first-seen time.
    Verdict:
      type: [object, 'null']
      description: Historical verdict for the merchant, or null if unavailable.
      required: [headline, tone, caveats]
      properties:
        headline:
          type: string
        tone:
          type: string
          enum: [ath, high, good, typical, low, young]
        caveats:
          type: array
          items:
            type: string
    Rate:
      type: object
      required: [rate_value, rate_unit, rate_kind, rate_display, unit_group]
      properties:
        rate_value:
          type: number
          description: Raw value in rate_unit. Use rate_display for the formatted value.
        rate_unit:
          $ref: '#/components/schemas/RateUnit'
        rate_kind:
          type: string
          enum: [earn_rate, one_time_bonus]
          description: |
            An earn_rate pays according to spend or volume. Every flat_* unit
            is a one_time_bonus for a qualifying purchase or action. Keep
            one-time bonuses separate from earn rates.
        rate_display:
          type: string
          description: Ready-to-display value and native unit. Check is_up_to where available.
        unit_group:
          type: string
          enum: [Cashback, Airline miles, Points, Other]
          description: Display group. Use the exact rate_unit for comparisons.
    RateUnit:
      type: string
      enum: [pct_cash, miles_per_dollar, points_per_dollar, cents_per_gallon, flat_cash, flat_miles, flat_points]
    QualifiedRate:
      allOf:
        - $ref: '#/components/schemas/Rate'
        - type: object
          required: [is_up_to, is_elevated, is_stale]
          properties:
            is_up_to:
              type: boolean
              description: True when the headline value is an upper bound. Display it as up to.
            is_elevated:
              type: boolean
              description: The stored rate is flagged as elevated.
            is_stale:
              type: boolean
              description: The row is overdue for confirmation. Flag it when displaying and avoid quoting it as current.
    RatePortal:
      type: object
      required: [portal_id, portal_name, program, payout_kind]
      properties:
        portal_id:
          type: string
        portal_name:
          type: string
        program:
          type: string
        payout_kind:
          $ref: '#/components/schemas/PayoutKind'
    PayoutKind:
      type: [string, 'null']
      enum: [gift_card, null]
      description: gift_card means rewards redeem as gift cards only. Null means no payout caveat was supplied.
    BestRate:
      allOf:
        - $ref: '#/components/schemas/QualifiedRate'
        - $ref: '#/components/schemas/RatePortal'
        - type: object
          required: [best_category_value, best_category_label, last_confirmed_at, go_url]
          properties:
            best_category_value:
              type: [number, 'null']
              description: Effective ranking value when a fresh same-unit category breakdown disproves the headline ceiling.
            best_category_label:
              type: [string, 'null']
              description: Category associated with the effective ranking value, when available.
            last_confirmed_at:
              type: string
              format: date-time
              description: This row's own confirmation time. Check it and is_stale before quoting the row.
            go_url:
              type: [string, 'null']
              format: uri
              description: |
                Outbound affiliate redirect on checkbeforeyoushop.com under
                /go/ with plc=api. Open only on user click. Clients must never
                prefetch it. Null when there is no configured outbound link.
    MerchantRate:
      allOf:
        - $ref: '#/components/schemas/BestRate'
        - type: object
          required: [listing_label]
          properties:
            listing_label:
              type: [string, 'null']
              description: Distinct portal listing name when multiple rows share a portal and the name distinguishes this row.
    PortalDirectoryData:
      type: object
      required: [count, active_count, portals]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of returned directory rows, including paused comparison portals.
        active_count:
          type: integer
          minimum: 0
          description: Number of active comparison portals.
        portals:
          type: array
          description: Alphabetical by name. The comparison directory excludes gift-card marketplaces.
          items:
            $ref: '#/components/schemas/PortalDirectory'
    PortalDirectory:
      allOf:
        - $ref: '#/components/schemas/PortalDetail'
        - type: object
          required: [payout_kind, is_active]
          properties:
            category:
              type: string
              enum: [cashback, airline, card, points]
            category_label:
              type: string
              enum: [Cashback, Airline miles, Credit-card points, Other points]
            payout_kind:
              $ref: '#/components/schemas/PayoutKind'
            is_active:
              type: boolean
              description: False when paused.
    PortalData:
      type: object
      required: [portal, top_rates]
      properties:
        portal:
          $ref: '#/components/schemas/PortalDetail'
        top_rates:
          type: array
          maxItems: 25
          description: |
            Up to 25 rows in the server's native-unit group order, earn units
            first, then by descending raw value within a unit. Rows can be
            stale. Use merchant detail for individual confirmation times and
            to check whether the portal lists a particular store.
          items:
            $ref: '#/components/schemas/PortalRate'
    PortalDetail:
      type: object
      required: [portal_id, name, program, category, category_label, merchants_tracked, cadence_hours, last_success_at, page_url]
      properties:
        portal_id:
          type: string
        name:
          type: string
        program:
          type: string
        category:
          type: string
          enum: [cashback, airline, card, points, giftcard]
        category_label:
          type: string
          enum: [Cashback, Airline miles, Credit-card points, Other points, Gift cards]
        merchants_tracked:
          type: integer
          minimum: 0
        cadence_hours:
          type: integer
          description: Configured primary check cadence in hours.
        last_success_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: Last successful portal check, or null if none is recorded.
        page_url:
          $ref: '#/components/schemas/PageUrl'
    MerchantLink:
      type: object
      required: [merchant_slug, merchant_name, page_url]
      properties:
        merchant_slug:
          type: string
        merchant_name:
          type: string
        page_url:
          $ref: '#/components/schemas/PageUrl'
    PortalRate:
      allOf:
        - $ref: '#/components/schemas/QualifiedRate'
        - $ref: '#/components/schemas/MerchantLink'
    HighsData:
      type: object
      required: [count, highs]
      properties:
        count:
          type: integer
          minimum: 0
          maximum: 800
          description: Number of returned high rows.
        highs:
          type: array
          maxItems: 800
          description: |
            Earn rates appear first, followed by one-time bonuses. The live
            candidate window is capped at 400 per kind before filtering and
            deduplication. Candidates need at least 7 observed days and must
            still be at or above 95% of the recorded 365-day high. Consult
            merchant detail for the row's freshness and up-to qualifier.
          items:
            $ref: '#/components/schemas/High'
    High:
      allOf:
        - $ref: '#/components/schemas/Rate'
        - $ref: '#/components/schemas/RatePortal'
        - $ref: '#/components/schemas/MerchantLink'
        - type: object
          required: [is_all_time_high, typical_range]
          properties:
            is_all_time_high:
              type: boolean
              description: True when recorded stats mark an all-time high and cover at least 30 observed days.
            typical_range:
              type: [string, 'null']
              description: Display text for the historical middle 50% in the native unit, or null when unavailable.
