name: Public API contract
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-check.txt
      - run: python -m pip install -r requirements-check.txt
      - run: python check_contract.py --offline --strict
      - run: python -m pytest tests/contract --ignore=tests/contract/test_typegen.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile captured responses against generated TypeScript
        run: python -m pytest tests/contract/test_typegen.py
      - name: Lint the OpenAPI contract
        run: npx --yes @redocly/cli@2.82.0 lint openapi.yaml
  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-check.txt
      - run: python -m pip install -r requirements-check.txt
      - run: python check_contract.py --strict
